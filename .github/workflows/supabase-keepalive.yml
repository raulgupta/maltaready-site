name: Supabase keep-alive
# Free-tier Supabase pauses after 7 days without API traffic. One harmless RPC a day keeps it awake.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call check_activation with a dummy device id
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://iguiivmlqzzorjwprkft.supabase.co/rest/v1/rpc/check_activation" \
            -H "apikey: sb_publishable_RH1xzZYTZiy3WLLuQt3r8A_VuNwyZc5" \
            -H "Authorization: Bearer sb_publishable_RH1xzZYTZiy3WLLuQt3r8A_VuNwyZc5" \
            -H "Content-Type: application/json" \
            -d '{"p_device":"00000000-0000-0000-0000-000000000000"}')
          echo "HTTP $code"
          test "$code" = "200"
